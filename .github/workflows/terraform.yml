name: Terraform

on:
  workflow_dispatch:
    inputs:
      target:
        description: 실행할 Terraform root를 선택합니다.
        required: true
        type: choice
        default: develop
        options:
          - develop
          - production
          - shared
      operation:
        description: plan만 실행할지, 환경 승인 후 apply까지 실행할지 선택합니다.
        required: true
        type: choice
        default: plan-only
        options:
          - plan-only
          - plan-and-apply
      confirm_environment:
        description: production apply를 허용하려면 production을 입력합니다. 그 외에는 비워 둡니다.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ inputs.target }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  PLAN_BUCKET: landit-terraform-plan-artifacts-982529430654
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    environment: terraform-plan-${{ inputs.target }}
    outputs:
      apply-environment: ${{ steps.target.outputs.apply-environment }}
      plan-file: ${{ steps.target.outputs.plan-file }}
      plan-key: ${{ steps.plan-metadata.outputs.plan-key }}
      plan-sha256: ${{ steps.plan-metadata.outputs.plan-sha256 }}
      root: ${{ steps.target.outputs.root }}
      state-key: ${{ steps.target.outputs.state-key }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: Resolve Terraform root
        id: target
        env:
          TARGET: ${{ inputs.target }}
        run: |
          case "$TARGET" in
            develop)
              echo "root=environments/dev" >> "$GITHUB_OUTPUT"
              echo "plan-file=develop.tfplan" >> "$GITHUB_OUTPUT"
              echo "state-key=dev/landit-iac/terraform.tfstate" >> "$GITHUB_OUTPUT"
              echo "apply-environment=terraform-apply-develop" >> "$GITHUB_OUTPUT"
              ;;
            production)
              echo "root=environments/prod" >> "$GITHUB_OUTPUT"
              echo "plan-file=production.tfplan" >> "$GITHUB_OUTPUT"
              echo "state-key=prod/landit-iac/terraform.tfstate" >> "$GITHUB_OUTPUT"
              echo "apply-environment=terraform-apply-production" >> "$GITHUB_OUTPUT"
              ;;
            shared)
              echo "root=environments/shared" >> "$GITHUB_OUTPUT"
              echo "plan-file=shared.tfplan" >> "$GITHUB_OUTPUT"
              echo "state-key=shared/landit-iac/terraform.tfstate" >> "$GITHUB_OUTPUT"
              echo "apply-environment=terraform-apply-shared" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unknown target: $TARGET"
              exit 1
              ;;
          esac

      - name: Show execution summary
        run: |
          cat <<EOF
          Target: ${{ inputs.target }}
          Operation: ${{ inputs.operation }}
          Terraform root: ${{ steps.target.outputs.root }}
          AWS account: 982529430654
          AWS region: $AWS_REGION
          State bucket: landit-terraform-state-982529430654
          State key: ${{ steps.target.outputs.state-key }}
          Apply environment: ${{ steps.target.outputs.apply-environment }}
          EOF

      - name: Require main branch for apply
        if: ${{ inputs.operation == 'plan-and-apply' && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Apply is only allowed from refs/heads/main."
          exit 1

      - name: Require production confirmation
        if: ${{ inputs.operation == 'plan-and-apply' && inputs.target == 'production' && inputs.confirm_environment != 'production' }}
        run: |
          echo "::error::Production apply requires confirm_environment=production."
          exit 1

      - name: Check AWS role variable
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::Set AWS_ROLE_ARN as a repository or environment variable."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-plan-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Terraform fmt check
        run: terraform fmt -recursive -check

      - name: Terraform init
        run: terraform -chdir="${{ steps.target.outputs.root }}" init -input=false

      - name: Terraform validate
        run: terraform -chdir="${{ steps.target.outputs.root }}" validate

      - name: Terraform speculative plan
        if: ${{ inputs.operation == 'plan-only' }}
        run: terraform -chdir="${{ steps.target.outputs.root }}" plan -input=false

      - name: Terraform saved plan
        if: ${{ inputs.operation == 'plan-and-apply' }}
        run: terraform -chdir="${{ steps.target.outputs.root }}" plan -input=false -out="$RUNNER_TEMP/${{ steps.target.outputs.plan-file }}"

      - name: Show saved plan
        if: ${{ inputs.operation == 'plan-and-apply' }}
        run: terraform -chdir="${{ steps.target.outputs.root }}" show -no-color "$RUNNER_TEMP/${{ steps.target.outputs.plan-file }}"

      - name: Resolve saved plan metadata
        id: plan-metadata
        if: ${{ inputs.operation == 'plan-and-apply' }}
        env:
          PLAN_FILE: ${{ steps.target.outputs.plan-file }}
          TARGET: ${{ inputs.target }}
        run: |
          PLAN_PATH="${RUNNER_TEMP}/${PLAN_FILE}"
          PLAN_KEY="plans/${TARGET}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${PLAN_FILE}"
          PLAN_SHA256="$(sha256sum "${PLAN_PATH}" | awk '{print $1}')"
          echo "plan-key=${PLAN_KEY}" >> "${GITHUB_OUTPUT}"
          echo "plan-sha256=${PLAN_SHA256}" >> "${GITHUB_OUTPUT}"

      - name: Upload saved plan to private S3
        if: ${{ inputs.operation == 'plan-and-apply' }}
        env:
          PLAN_FILE: ${{ steps.target.outputs.plan-file }}
          PLAN_KEY: ${{ steps.plan-metadata.outputs.plan-key }}
        run: |
          PLAN_PATH="${RUNNER_TEMP}/${PLAN_FILE}"
          aws s3 cp "${PLAN_PATH}" "s3://${PLAN_BUCKET}/${PLAN_KEY}" --only-show-errors

  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: plan
    if: ${{ inputs.operation == 'plan-and-apply' }}
    environment: terraform-apply-${{ inputs.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: Check AWS role variable
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::Set AWS_ROLE_ARN as a repository or environment variable."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-apply-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Download and verify saved plan
        env:
          EXPECTED_PLAN_SHA256: ${{ needs.plan.outputs.plan-sha256 }}
          PLAN_FILE: ${{ needs.plan.outputs.plan-file }}
          PLAN_KEY: ${{ needs.plan.outputs.plan-key }}
        run: |
          PLAN_DIRECTORY="${RUNNER_TEMP}/terraform-plan"
          PLAN_PATH="${PLAN_DIRECTORY}/${PLAN_FILE}"
          mkdir -p "${PLAN_DIRECTORY}"
          aws s3 cp "s3://${PLAN_BUCKET}/${PLAN_KEY}" "${PLAN_PATH}" --only-show-errors
          echo "${EXPECTED_PLAN_SHA256}  ${PLAN_PATH}" | sha256sum --check --strict

      - name: Terraform init
        run: terraform -chdir="${{ needs.plan.outputs.root }}" init -input=false

      - name: Terraform apply
        env:
          PLAN_FILE: ${{ needs.plan.outputs.plan-file }}
        run: terraform -chdir="${{ needs.plan.outputs.root }}" apply -input=false "$RUNNER_TEMP/terraform-plan/${PLAN_FILE}"
